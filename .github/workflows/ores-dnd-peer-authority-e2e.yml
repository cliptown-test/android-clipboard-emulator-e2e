name: ores-dnd peer-authority conformance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-dnd-peer-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ORES_DND_SHA: d2980dabb2e9581c091c6106599b678b21634ff7

jobs:
  tjsv-peer-authorities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact test head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out exact green ores-dnd producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-dnd
          ref: ${{ env.ORES_DND_SHA }}
          path: .deps/ores-dnd
          persist-credentials: false
      - name: Verify exact producer pin
        run: test "$(git -C .deps/ores-dnd rev-parse HEAD)" = "$ORES_DND_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install reviewed TJSV toolchain without ambient lifecycle scripts
        working-directory: .deps/ores-dnd
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build reviewed flags2env native binding only
        working-directory: .deps/ores-dnd
        run: npm --prefix node_modules/@oresoftware/f2e run install
      - name: Positive peer-authority parity and generated witness
        working-directory: .deps/ores-dnd
        run: |
          mkdir -p artifacts/generated
          ./node_modules/.bin/tjsv check \
            --typespec=contracts/main.tsp \
            --schema=contracts/authored.schema.json \
            --instances=contracts/instances \
            --output-dir=artifacts/generated \
            --bundle-id=typespec.generated.schema.json \
            --report=artifacts/schema-parity.json \
            --quiet
          test -s artifacts/generated/typespec.generated.schema.json
          test -s artifacts/schema-parity.json
      - name: TypeSpec-only drift must stop promotion
        working-directory: .deps/ores-dnd
        run: |
          case_dir="$(mktemp -d "$PWD/.peer-typespec-drift.XXXXXX")"
          cp -R contracts/. "$case_dir/"
          node - "$case_dir/main.tsp" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const source = fs.readFileSync(path, 'utf8');
          const changed = source.replace('sourceRuntime: string;', 'sourceRuntime: int32;');
          if (changed === source) throw new Error('expected TypeSpec mutation point was absent');
          fs.writeFileSync(path, changed);
          NODE
          set +e
          ./node_modules/.bin/tjsv check \
            --typespec="$case_dir/main.tsp" \
            --schema="$case_dir/authored.schema.json" \
            --instances="$case_dir/instances" \
            --output-dir="$case_dir/generated" \
            --bundle-id=typespec.generated.schema.json \
            --report="$case_dir/report.json" \
            --quiet
          status=$?
          set -e
          test "$status" -eq 2
          test -s "$case_dir/generated/typespec.generated.schema.json"
      - name: Authored JSON Schema-only drift must stop promotion
        working-directory: .deps/ores-dnd
        run: |
          case_dir="$(mktemp -d "$PWD/.peer-json-drift.XXXXXX")"
          cp -R contracts/. "$case_dir/"
          node - "$case_dir/authored.schema.json" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const schema = JSON.parse(fs.readFileSync(path, 'utf8'));
          const field = schema?.$defs?.DndEnvelope?.properties?.sourceRuntime;
          if (!field) throw new Error('expected authored JSON Schema mutation point was absent');
          field.type = 'integer';
          fs.writeFileSync(path, `${JSON.stringify(schema, null, 2)}\n`);
          NODE
          set +e
          ./node_modules/.bin/tjsv check \
            --typespec="$case_dir/main.tsp" \
            --schema="$case_dir/authored.schema.json" \
            --instances="$case_dir/instances" \
            --output-dir="$case_dir/generated" \
            --bundle-id=typespec.generated.schema.json \
            --report="$case_dir/report.json" \
            --quiet
          status=$?
          set -e
          test "$status" -eq 2
          test -s "$case_dir/generated/typespec.generated.schema.json"
